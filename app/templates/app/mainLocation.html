{% load static %}

<div class="location">
    <div class="locationInformation">
        <div class="officeColumn">
            <strong>ОФИС</strong>
            <p>{{ site.office_full }}</p>
            <div>
                <span>РЕЖИМ РАБОТЫ</span>
                <span>{{ site.work_hours }}</span>
            </div>
        </div>
        <div class="warehouseColumn">
            <strong>СКЛАД</strong>
            <p>{{ site.warehouse_full }}</p>
            <div>
                <span>РЕЖИМ РАБОТЫ</span>
                <span>{{ site.work_hours }}</span>
            </div>
        </div>
    </div>
    {% if yandex_maps_api_key %}
    <div id="map" aria-label="Карта с метками офиса и склада"></div>
    {% else %}
    <p class="map-fallback">Карта появится после указания YANDEX_MAPS_API_KEY в .env. Адреса выше — демонстрационные.</p>
    {% endif %}
</div>
